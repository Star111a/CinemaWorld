 <!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - Cinema World</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <main class="auth-container">

    <div class="auth-box row-login">

      <!-- მარცხენა -->
      <div class="login-left">

        <h1>JOIN CINEMA WORLD 🎬</h1>

        <p>
          Create your account and enjoy
          unlimited movie experience.
        </p>

        <img
          src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop"
          alt="Cinema"
        >

      </div>

      <!-- მარჯვენა -->
      <div class="login-right">

        <h2>Register</h2>

        <form id="registerForm">

          <label>
            Full Name
          </label>

          <input
            type="text"
            id="registerName"
            placeholder="Enter your full name"
            required
          >

          <label>
            Email
          </label>

          <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
            required
          >

          <label>
            Password
          </label>

          <input
            type="password"
            id="registerPassword"
            placeholder="Create password"
            required
          >

          <button type="submit">
            Register
          </button>

        </form>

        <p class="switch-text">

          Already have an account?

          <a href="login.html">
            Login
          </a>

        </p>

      </div>

    </div>

  </main>

  <script src="auth.js"></script>

</body>
</html>
