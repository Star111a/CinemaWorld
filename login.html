<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Cinema World</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <!--ეს არის მთელი login გვერდის ჩარჩო, აწყობს ყველაფერს ცენტრში CSS-ით -->
  <main class="auth-container">

    <!--ეს არის login card-->
    <div class="auth-box row-login">

      <!-- მარცხენა -->
      <div class="login-left">

        <h1>CINEMA WORLD 🎬</h1>

        <p>
          Watch the best international movies
          with modern cinema experience.
        </p>

        <img
          src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop"
          alt="Cinema"
        >

      </div>

      <!-- მაჯვენა  -->
      <div class="login-right">

        <h2>Login</h2>

        <!--შესვლის ფორმა-->
        <form id="loginForm">

          <label for="loginEmail">
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          >

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
            required
          >

          <button type="submit">
            Login
          </button>

        </form>

        <!--ტექსტი, რომელიც გეუბნება-->
        <p class="switch-text">

          Don't have an account?

          <a href="register.html">
            Register
          </a>

        </p>

      </div>

    </div>

  </main>

  <script src="auth.js"></script>

</body>
</html>
